services:
  # ====================================================================
  # ۱. PostgreSQL 16 + PostGIS
  # ====================================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sabtbrooker-db
    environment:
      POSTGRES_USER: ${DB_USER:-sabtbrooker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sabtbrooker}
      POSTGRES_DB: ${DB_NAME:-sabtbrooker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sabtbrooker}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۲. Redis
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: sabtbrooker-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۳. NATS JetStream
  # ====================================================================
  nats:
    image: nats:2.10-alpine
    container_name: sabtbrooker-nats
    command: -js
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۴. MinIO (Object Storage)
  # ====================================================================
  minio:
    image: minio/minio:latest
    container_name: sabtbrooker-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۵. Backend API (Go)
  # ====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sabtbrooker-backend
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-sabtbrooker}
      DB_PASSWORD: ${DB_PASSWORD:-sabtbrooker}
      DB_NAME: ${DB_NAME:-sabtbrooker}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-sabtbrooker}
      MINIO_USE_SSL: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_NUMBER: ${SMS_SENDER_NUMBER:-}
      PSP_MERCHANT_ID: ${PSP_MERCHANT_ID:-}
      SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۶. Frontend (Next.js PWA)
  # ====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sabtbrooker-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://API_DOMAIN/api}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal

  # ====================================================================
  # ۷. Nginx (Reverse Proxy + SSL)
  # ====================================================================
  nginx:
    image: nginx:1.26-alpine
    container_name: sabtbrooker-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
